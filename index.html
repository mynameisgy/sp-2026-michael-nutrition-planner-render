<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F2A0AB" />
  <title>家庭营养 · 食材规划</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- SNAIL-VERSION-BADGE:START -->
<!-- snail-version: V1.3.0 | commit: v1.3.0 | 2026-09-01 -->
<div id="snail-version-badge" style="position:fixed;top:10px;left:12px;z-index:2147483647;padding:3px 10px;border-radius:999px;background:rgba(17,17,17,.82);color:#fff;font:600 12px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.28);pointer-events:none;user-select:none;">V1.3.0</div>
<!-- SNAIL-VERSION-BADGE:END -->
  <header class="app-header">
    <div class="brand-row">
      <span id="app-version" class="app-version">1.3.0</span>
      <div class="mascot" aria-hidden="true">
        <span class="mascot-mom">👨‍👩‍👧‍👦</span>
      </div>
      <div class="brand-text">
        <div class="brand-title">家庭营养小帮手</div>
        <div class="brand-sub">按每位家庭成员的年龄 / 身体情况，定制专属餐单</div>
      </div>
      <button id="btn-reset" class="ghost-btn" title="重置全部数据">重置</button>
    </div>
    <div class="header-row">
      <h1 id="app-title">今日</h1>
      <span id="app-date" class="app-date"></span>
    </div>
  </header>

  <!-- 家庭成员切换条 -->
  <div class="member-bar" id="member-bar"></div>

  <main id="view-container">
    <section id="page-today" class="page"></section>
    <section id="page-week" class="page hidden"></section>
    <section id="page-recipes" class="page hidden"></section>
    <section id="page-shopping" class="page hidden"></section>
    <section id="page-pantry" class="page hidden"></section>
    <section id="page-plan" class="page hidden"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-page="today"><span class="tab-i">📅</span><span>今日</span></button>
    <button class="tab" data-page="week"><span class="tab-i">🗓️</span><span>本周</span></button>
    <button class="tab" data-page="recipes"><span class="tab-i">🍲</span><span>食谱</span></button>
    <button class="tab" data-page="shopping"><span class="tab-i">🛒</span><span>采购</span></button>
    <button class="tab" data-page="pantry"><span class="tab-i">🧺</span><span>库存</span></button>
    <button class="tab" data-page="plan"><span class="tab-i">📋</span><span>方案</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
