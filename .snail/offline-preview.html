<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F2A0AB" />
  <title>家庭营养 · 食材规划</title>
  <style>
/* ============================================================
   家庭营养 · 食材规划 — 亲子风视觉（温暖 / 圆润 / 萌系）
   三色体系：薄荷绿=女儿(幼儿) · 玫瑰粉=老婆(孕妇) · 暖橙=一锅两吃(共享)
   ============================================================ */
:root {
  --bg: #FFF6F2;
  --surface: #FFFFFF;
  --surface-2: #FFEFE9;
  --text: #3D3733;
  --text-soft: #8C827B;
  --text-hint: #B6ABA3;
  --border: #F2E6DF;

  /* 人物主题色 */
  --toddler: #3FB89C;      /* 女儿 · 薄荷绿 */
  --toddler-soft: #E1F5F0;
  --mom: #EE8FA0;          /* 老婆 · 玫瑰粉（孕） */
  --mom-soft: #FCE7EC;
  --common: #F2A65A;       /* 共享 · 暖橙 */
  --common-soft: #FCEBD8;

  --brand-gradient: linear-gradient(120deg, #6FCBB4 0%, #F2A0AB 100%);
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 18px rgba(214,150,130,.12);
  --shadow-soft: 0 2px 8px rgba(214,150,130,.10);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: linear-gradient(180deg, #FFF7F3 0%, #FCEFEA 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: var(--brand-gradient);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
  box-shadow: 0 4px 16px rgba(238,143,160,.25);
}
.brand-row { display: flex; align-items: center; gap: 10px; }
.mascot {
  position: relative; flex: 0 0 auto;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.92);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; line-height: 1;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  animation: float 3.2s ease-in-out infinite;
}
.mascot-mom { transform: translateY(-1px); }
.mascot-baby {
  position: absolute; right: -4px; bottom: -4px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,.18);
}
.brand-text { flex: 1; min-width: 0; }
.brand-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,.92); margin-top: 1px; }
.ghost-btn {
  flex: 0 0 auto;
  border: 1px solid rgba(255,255,255,.7); background: rgba(255,255,255,.18);
  color: #fff; font-size: 12px; padding: 5px 13px; border-radius: 20px; cursor: pointer;
  backdrop-filter: blur(2px);
}
.ghost-btn:active { background: rgba(255,255,255,.34); }

/* 左上角版本号角标 */
.app-version {
  flex: 0 0 auto;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .4px;
  color: #fff;
  background: rgba(0,0,0,.22);
  padding: 3px 8px;
  border-radius: 999px;
  line-height: 1.4;
  white-space: nowrap;
}

.header-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 12px; }
.app-header h1 {
  font-size: 22px; font-weight: 700; margin: 0; color: #fff; letter-spacing: .5px;
}
.app-date { font-size: 12px; color: rgba(255,255,255,.9); }

/* ---------- Main / pages ---------- */
#view-container { padding: 14px 14px 96px; max-width: 720px; margin: 0 auto; }
.page { animation: fade .2s ease; }
.hidden { display: none !important; }
@keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
@keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)} }

/* ---------- Cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px; margin-bottom: 13px; box-shadow: var(--shadow);
}
.card-title {
  font-size: 15px; font-weight: 700; margin: 0 0 4px;
  display: flex; align-items: center; gap: 8px;
}
.card-title::before {
  content: ""; width: 6px; height: 16px; border-radius: 4px;
  background: var(--brand-gradient);
}
.card-sub { font-size: 12px; color: var(--text-soft); margin: 0 0 10px; line-height: 1.5; }

/* ---------- Person badge ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; white-space: nowrap;
}
.badge.toddler { background: var(--toddler-soft); color: var(--toddler); }
.badge.mom { background: var(--mom-soft); color: var(--mom); }
.badge.common { background: var(--common-soft); color: var(--common); }

/* ---------- Meal row (today) ---------- */
.meal-block { border-bottom: 1px dashed var(--border); padding: 12px 0; }
.meal-block:last-child { border-bottom: none; }
.meal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.meal-time {
  font-size: 13px; font-weight: 700; color: var(--text);
  background: var(--surface-2); padding: 3px 10px; border-radius: 20px;
}
.meal-time small { font-weight: 400; color: var(--text-hint); margin-left: 6px; font-size: 11px; }
.check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 14px;
  transition: border-color .15s, background .15s;
}
.check.done { background: var(--toddler); border-color: var(--toddler); animation: pop .25s ease; }
.meal-person { margin-bottom: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.meal-person .who { font-size: 11px; color: var(--text-soft); width: 36px; flex: 0 0 auto; }
.meal-dish { font-size: 15px; font-weight: 600; }
.meal-dish.empty { color: var(--text-hint); font-weight: 400; font-style: italic; }

/* ---------- Week grid ---------- */
.week-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: -2px -2px 12px; }
.week-days {
  flex: 0 0 auto; padding: 8px 13px; border-radius: 14px; background: var(--surface);
  font-size: 12px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; white-space: nowrap; color: var(--text-soft);
  box-shadow: var(--shadow-soft);
}
.week-days.active { background: var(--brand-gradient); color: #fff; border-color: transparent; }
.week-days small { display: block; font-size: 10px; opacity: .85; }
.day-meal { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
.day-meal:last-child { border-bottom: none; }
.day-meal .slot { font-size: 12px; color: var(--text-soft); width: 70px; flex: 0 0 auto; font-weight: 600; }
.day-meal .dishes { flex: 1; }
.day-meal .d { font-size: 13px; margin: 2px 0; }
.day-meal .shared { font-size: 11px; color: var(--common); margin-top: 3px; font-weight: 600; }

/* ---------- Recipe list ---------- */
.search-bar {
  width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 14px;
  font-size: 14px; background: var(--surface); margin-bottom: 10px; outline: none; box-shadow: var(--shadow-soft);
}
.search-bar:focus { border-color: var(--mom); }
.chips { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.chip {
  flex: 0 0 auto; padding: 7px 13px; border-radius: 20px; background: var(--surface);
  font-size: 12px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; white-space: nowrap; color: var(--text-soft);
  box-shadow: var(--shadow-soft);
}
.chip.active { background: var(--common); color: #fff; border-color: transparent; }
.recipe {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 11px; box-shadow: var(--shadow);
}
.recipe-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.recipe-name { font-size: 16px; font-weight: 700; }
.recipe-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.tag { font-size: 10px; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); color: var(--text-soft); font-weight: 600; }
.tags-nutri .tag { background: var(--toddler-soft); color: var(--toddler); }
.recipe-meta { font-size: 11px; color: var(--text-soft); margin-top: 6px; }
.recipe-detail { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; display: none; }
.recipe-detail.open { display: block; }
.recipe-detail h4 { font-size: 12px; margin: 11px 0 4px; color: var(--common); font-weight: 700; }
.recipe-detail ul { margin: 4px 0; padding-left: 18px; font-size: 13px; }
.recipe-detail p { font-size: 13px; margin: 4px 0; line-height: 1.6; }
.nutri-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 7px; }
.nutri-cell { background: var(--surface-2); border-radius: 10px; padding: 7px 8px; text-align: center; }
.nutri-cell .v { font-size: 13px; font-weight: 700; color: var(--toddler); }
.nutri-cell .l { font-size: 10px; color: var(--text-soft); }

/* ---------- Shopping ---------- */
.shop-group { margin-bottom: 16px; }
.shop-group h3 { font-size: 13px; margin: 0 0 9px; display: flex; align-items: center; gap: 6px; color: var(--text); font-weight: 700; }
.shop-group h3::before { content: ""; width: 5px; height: 14px; border-radius: 3px; background: var(--mom); }
.shop-item {
  display: flex; align-items: center; gap: 11px; padding: 11px 13px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; box-shadow: var(--shadow-soft);
}
.shop-item .box {
  width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; cursor: pointer;
}
.shop-item.done .box { background: var(--toddler); border-color: var(--toddler); animation: pop .25s ease; }
.shop-item .name { flex: 1; font-size: 14px; font-weight: 500; }
.shop-item.done .name { text-decoration: line-through; color: var(--text-hint); }
.shop-item .qty { font-size: 13px; color: var(--text-soft); font-weight: 600; }
.shop-progress { font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
.bar-bg { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; margin: 6px 0 14px; }
.bar-fg { height: 100%; background: var(--brand-gradient); border-radius: 6px; transition: width .35s ease; }
.shop-actions { display: flex; gap: 8px; margin-bottom: 14px; }
.btn { flex: 1; padding: 11px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--mom); color: #fff; box-shadow: 0 3px 10px rgba(238,143,160,.35); }
.btn-soft { background: var(--surface-2); color: var(--text); }

/* ---------- Pantry ---------- */
.add-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.add-row input {
  flex: 1; min-width: 88px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 12px;
  font-size: 13px; background: var(--surface); outline: none; box-shadow: var(--shadow-soft);
}
.add-row input:focus { border-color: var(--toddler); }
.add-row select {
  padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); outline: none;
}
.pantry-item {
  display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; box-shadow: var(--shadow-soft);
}
.pantry-item .pi-left { font-size: 14px; font-weight: 600; }
.pantry-item .pi-sub { font-size: 11px; color: var(--text-soft); font-weight: 400; }
.pantry-item.urgent { border-color: var(--mom); background: var(--mom-soft); }
.pantry-item .pi-del { color: var(--mom); font-size: 12px; background: none; border: none; cursor: pointer; padding: 4px 6px; font-weight: 600; }
.urgent-tag { font-size: 10px; color: #fff; background: var(--mom); border-radius: 6px; padding: 1px 6px; margin-left: 6px; font-weight: 700; }

/* ---------- Nutrition ---------- */
.nutri-track { margin-bottom: 15px; }
.nutri-track .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.nutri-track .row .name { font-weight: 600; }
.nutri-track .row .val { color: var(--text-soft); font-size: 12px; }
.nutri-track .bar-bg { margin: 2px 0 0; }
.track-fg { height: 100%; border-radius: 6px; }
.track-fg.ok { background: var(--toddler); }
.track-fg.low { background: #E6B23A; }
.track-fg.over { background: var(--mom); }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; background: rgba(255,255,255,.94); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
  backdrop-filter: blur(8px);
  box-shadow: 0 -4px 16px rgba(214,150,130,.10);
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 0 6px; color: var(--text-hint); font-size: 10px; font-weight: 600;
}
.tab .tab-i {
  width: 30px; height: 30px; border-radius: 11px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  transition: transform .15s;
}
.tab:active .tab-i { transform: scale(.9); }
.tab.active { color: var(--mom); }
.tab.active .tab-i { background: var(--brand-gradient); transform: translateY(-2px); box-shadow: 0 3px 10px rgba(238,143,160,.35); }

/* ---------- misc ---------- */
.section-h {
  font-size: 13px; font-weight: 700; color: var(--text); margin: 18px 2px 10px;
  display: flex; align-items: center; gap: 6px;
}
.section-h::before { content: "🌿"; font-size: 13px; }
.empty-hint { text-align: center; color: var(--text-hint); font-size: 14px; padding: 30px 0; line-height: 1.7; }
.note { font-size: 11px; color: var(--text-hint); margin-top: 8px; line-height: 1.6; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* ---------- 成员切换条 ---------- */
.member-bar {
  position: sticky; top: 0; z-index: 19;
  display: flex; gap: 7px; overflow-x: auto; padding: 10px 14px 8px;
  background: linear-gradient(180deg, #FFF7F3 0%, rgba(255,247,243,.92) 100%);
  backdrop-filter: blur(6px);
}
.mchip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
  padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--border); cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-soft);
  font-size: 13px; font-weight: 600; color: var(--text); transition: transform .12s;
}
.mchip:active { transform: scale(.96); }
.mchip.active { box-shadow: 0 3px 10px rgba(214,150,130,.22); }
.mchip .m-emoji {
  width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
}
.mchip.add { padding: 0; width: 36px; height: 36px; justify-content: center; font-size: 20px; color: var(--mom); font-weight: 700; text-decoration: none; }

/* ---------- 成员卡头 ---------- */
.member-card { border-width: 1.5px !important; }
.mc-head { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
.mc-avatar {
  width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 22px; color: #fff; flex: 0 0 auto; box-shadow: var(--shadow-soft);
}
.mc-name { font-size: 16px; font-weight: 700; }
.mc-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

/* ---------- 适配说明 / 红绿灯 ---------- */
.adapt-note {
  font-size: 12px; line-height: 1.6; margin: 6px 0 0; padding: 7px 10px; border-radius: 10px;
  background: var(--surface-2); color: var(--text-soft);
}
.adapt-note.avoid { background: #FDECEE; color: #B3343F; font-weight: 600; }
.adapt-note.good { background: #E6F6EF; color: #2E8B6F; }
.suit { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.suit.good { background: #E6F6EF; color: #2E8B6F; }
.suit.avoid { background: #FDECEE; color: #B3343F; }
.suit.neutral { background: var(--surface-2); color: var(--text-hint); }
.badge.member { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

/* ---------- 方案页 ---------- */
.target-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.target-cell { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; }
.target-cell .v { font-size: 16px; font-weight: 700; color: var(--toddler); }
.target-cell .l { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
.target-cell .u { font-size: 10px; color: var(--text-hint); }
.advice-list { margin: 4px 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
.advice-list li { margin: 4px 0; }

/* ---------- 后台成员卡 ---------- */
.member-card { border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
.member-card.open { border-color: var(--mom); }
.mc-top { display: flex; align-items: center; gap: 10px; }
.mc-avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; flex: 0 0 auto; }
.mc-name { font-weight: 700; font-size: 15px; }
.mc-edit { margin-top: 12px; }
.cond-group { margin: 6px 0; }
.cond-g-title { font-size: 11px; color: var(--text-soft); margin-bottom: 4px; }
.cond-row { display: flex; flex-wrap: wrap; gap: 8px; }
.cond { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text); background: var(--surface-2); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.cond input { margin: 0; }

</style>
</head>

  <header class="app-header">

        <span class="mascot-mom">👨‍👩‍👧‍👦</span>

        <div class="brand-title">家庭营养小帮手</div>

  <!-- 家庭成员切换条 -->
  <div class="member-bar" id="member-bar"></div>

  <main id="view-container">
    <section id="page-today" class="page"></section>
    <section id="page-week" class="page hidden"></section>
    <section id="page-recipes" class="page hidden"></section>

  </main>

  <nav class="tabbar">
    <button class="tab active" data-page="today"><span class="tab-i">📅</span><span>今日</span></button>
    <button class="tab" data-page="week"><span class="tab-i">🗓️</span><span>本周</span></button>
    <button class="tab" data-page="recipes"><span class="tab-i">🍲</span><span>食谱</span></button>
    <button class="tab" data-page="shopping"><span class="tab-i">🛒</span><span>采购</span></button>
    <button class="tab" data-page="pantry"><span class="tab-i">🧺</span><span>库存</span></button>

  <script>

      json: function () { return Promise.resolve(body); },

  }
  window.fetch = function (p, opts) {
    opts = opts || {};
    var path = String(p).split('?')[0];
    var m = path.match(/^\/api\/kv\/(.+)$/);
    if (m) {
      var key = decodeURIComponent(m[1]);
      if (opts.method === 'PUT') { try { DATA.state[key] = JSON.parse(opts.body || '{}').value; } catch (e) {} return reply({ ok: true }); }
      return reply({ value: DATA.state[key] || {} });
    }
    if (Object.prototype.hasOwnProperty.call(ROUTES, path)) return reply(ROUTES[path]);

<script>
/* 家庭营养 · 食材规划 — 前端逻辑（API 驱动，数据为后端 SQLite 单一来源）
   成员模式：每位家庭成员是真实的人（年龄 / 性别 / 身体问题），全家共享周菜单，
   但每位成员看到自己的适配说明、红灯提醒，并可一键生成专属周方案。 */
(function () {
  "use strict";

  /* ---------- 营养追踪用到的营养素顺序（仅展示结构，数值来自后端标准） ---------- */
  var NUTRI_KEYS = [
    { k: "kcal", name: "能量", unit: "kcal" },
    { k: "protein", name: "蛋白质", unit: "g" },
    { k: "calcium", name: "钙", unit: "mg" },
    { k: "iron", name: "铁", unit: "mg" },
    { k: "zinc", name: "锌", unit: "mg" },
    { k: "vitC", name: "维C", unit: "mg" },
    { k: "dha", name: "DHA", unit: "mg" },
    { k: "folate", name: "叶酸", unit: "μg" },
    { k: "fiber", name: "膳食纤维", unit: "g" }
  ];

  /* 过敏食材（条件 → 需规避的食材名）；与 server/planner.js 保持一致 */
  var ALLERGEN = {
    allergy_egg: ["鸡蛋"], allergy_milk: ["牛奶", "酸奶"], allergy_seafood: ["鳕鱼", "三文鱼", "鲈鱼", "虾仁"],
    allergy_nut: ["核桃"], allergy_soy: ["豆腐"], allergy_wheat: ["面条", "全麦面包", "全麦馒头"]
  };
  /* 身体问题 → 推荐优先标签（命中即为绿灯） */
  var COND_HL = {
    pregnancy: ["补叶酸", "补铁", "补钙", "补DHA"], lactation: ["补钙", "补蛋白", "补DHA"],
    anemia: ["补铁", "补叶酸"], low_calcium: ["补钙"],
    hypertension: ["补纤维"], diabetes: ["补纤维"], hyperlipidemia: ["补纤维"]
  };

  /* ---------- 状态（来自后端） ---------- */
  var state = { standards: null, members: [], recipes: [], week: [], pantry: [], shoppingChecked: {}, doneMeals: {} };
  var currentPage = "today";
  var currentMember = null;       // 当前查看的成员 id
  var recipeFilter = { q: "", tag: "全部" };
  var lastShopping = null;
  var planCache = {};             // 成员方案缓存（target/advice/week）

  /* ---------- API ---------- */
  function api(path, opts) {
    opts = opts || {};
    opts.headers = { "Content-Type": "application/json" };
    return fetch(path, opts).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function showBackendError(detail) {
    var box = document.getElementById("view-container");
    if (box) {
      box.innerHTML =
        '<section class="page">' +
        '<div style="margin:24px 16px;padding:20px;border-radius:14px;background:#fff5f6;' +
        'border:1px solid #f3c6cc;color:#7a2b33;line-height:1.75;font-size:15px">' +
        '<div style="font-size:18px;font-weight:700;margin-bottom:10px">⚠️ 连不上后端，数据没拿到</div>' +
        '<div>这个页面所有数据都来自后端接口 <code>/api/state</code>，现在没取到，所以页面是空的（不是浏览器坏了）。</div>' +
        '<div style="margin-top:12px">请在项目目录执行：</div>' +
        '<pre style="margin:8px 0;padding:10px 12px;background:#fff;border:1px solid #f0d5d9;' +
        'border-radius:8px;overflow:auto">node --experimental-sqlite server/server.js</pre>' +
        '<div>然后用浏览器打开 <b>http://localhost:3000</b>（不要直接双击 index.html 打开）。</div>' +
        (detail ? '<div style="margin-top:10px;font-size:13px;color:#a4686f">错误详情：' + esc(String(detail)) + '</div>' : '') +
        "</div></section>";
    }
    toast("无法连接后端，请确认服务已启动 (node --experimental-sqlite server/server.js)");
  }
  function loadState(cb) {
    api("/api/state").then(function (s) {
      state = s;
      if (!currentMember && state.members && state.members.length) currentMember = state.members[0].id;
      cb && cb();
    }).catch(function (e) { showBackendError(e && e.message ? e.message : e); });
  }
  function loadVersion() {
    api("/api/version").then(function (d) {
      var el = document.getElementById("app-version");
      if (el && d && d.version) el.textContent = d.version;
    }).catch(function () {});
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function daysAgo(n) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function byId(id) {
    for (var i = 0; i < state.recipes.length; i++) if (state.recipes[i].id === id) return state.recipes[i];
    return null;
  }
  function todayIndex() {
    var d = new Date().getDay();
    return d === 0 ? 6 : d - 1;
  }
  function fmtG(g) {
    if (g >= 1000) return (g / 1000).toFixed(g % 1000 === 0 ? 0 : 1) + " kg";
    return Math.round(g) + " g";
  }
  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2400);
  }

  /* ---------- 成员工具 ---------- */
  function members() { return state.members || []; }
  function memberById(id) {
    for (var i = 0; i < members().length; i++) if (members()[i].id === id) return members()[i];
    return null;
  }
  function currentMemberObj() { return memberById(currentMember) || members()[0]; }
  function memberAgeText(m) {
    var y = m.ageYears || 0, mo = m.ageMonths || 0;
    if (y < 1) return mo + "个月";
    if (mo > 0) return y + "岁" + mo + "个月";
    return y + "岁";
  }
  function portionFor(m) {
    var age = (m.ageYears || 0) + (m.ageMonths || 0) / 12;
    if (age < 3) return 0.5;
    if (age < 6) return 0.8;
    if (age < 18) return 0.9;
    if (age >= 65) return 0.9;
    return 1.0;
  }
  function memberBadge(m, extra) {
    var c = m.color || "#888";
    return '<span class="badge member" style="background:' + c + '22;color:' + c + '">' +
      (m.emoji || "👤") + " " + esc(m.name) + (extra ? " · " + esc(extra) : "") + "</span>";
  }
  /* 前端适配性（与 server/planner.js 同源逻辑） */
  function clientSuitability(m, recipe) {
    if (!recipe) return { status: "neutral", reasons: [] };
    var conds = m.conditions || [];
    var exclude = [];
    conds.forEach(function (c) { if (ALLERGEN[c]) exclude = exclude.concat(ALLERGEN[c]); });
    var ings = (recipe.ing || []).map(function (i) { return i.name; });
    var hit = exclude.filter(function (x) { return ings.indexOf(x) >= 0; });
    if (hit.length) return { status: "avoid", reasons: ["含过敏食材：" + hit.join("、")] };
    var hl = [];
    conds.forEach(function (c) {
      (COND_HL[c] || []).forEach(function (t) { if ((recipe.tags || []).indexOf(t) >= 0) hl.push(t); });
    });
    if (hl.length) return { status: "good", reasons: ["契合需求：" + hl.join("、")] };
    return { status: "neutral", reasons: [] };
  }
  function suitBadge(suit) {
    if (suit.status === "avoid") return '<span class="suit avoid">🔴 注意</span>';
    if (suit.status === "good") return '<span class="suit good">🟢 合适</span>';
    return '<span class="suit neutral">⚪ 普通</span>';
  }

  /* ---------- 渲染：成员切换条 ---------- */
  function renderMemberBar() {
    var bar = document.getElementById("member-bar");
    if (!bar) return;

      var active = m.id === currentMember ? " active" : "";
      html += '<div class="mchip' + active + '" data-mid="' + esc(m.id) + '" style="' +

  /* ---------- 营养计算（按当前成员的份量折算） ---------- */
  function emptyNutri() { var o = {}; NUTRI_KEYS.forEach(function (n) { o[n.k] = 0; }); return o; }
  function addNutri(acc, recipe, factor) {
    if (!recipe) return;
    var nu = recipe.nutri || {};
    NUTRI_KEYS.forEach(function (n) { acc[n.k] += (nu[n.k] || 0) * factor; });
  }
  function dayNutriFor(day, mid) {
    var acc = emptyNutri();
    var m = memberById(mid);
    var factor = m ? portionFor(m) : 1;
    var slots = day.slots;
    Object.keys(slots).forEach(function (sk) {
      var rid = (slots[sk] || {})[mid];
      if (rid) addNutri(acc, byId(rid), factor);
    });
    return acc;
  }
  function weekNutriFor(mid) {
    var acc = emptyNutri();
    state.week.forEach(function (day) {
      var dn = dayNutriFor(day, mid);
      NUTRI_KEYS.forEach(function (n) { acc[n.k] += dn[n.k]; });
    });
    return acc;
  }

  function loadPlanBody(m) {
    var body = document.getElementById("plan-body");
    // 离线快照里有预烘焙的方案
    var off = window.__OFFLINE_PLANS && window.__OFFLINE_PLANS[m.id];

    api("POST", "/api/members/" + encodeURIComponent(m.id) + "/plan", { week: state.week })
      .then(function (d) { planCache[m.id] = d; paintPlanBody(m, d.advice || [], d.disclaimer, false, d); })

  function paintPlanBody(m, advice, disclaimer, offline, planData) {
    var body = document.getElementById("plan-body");
    if (!body) return;
    var std = (state.standards && state.standards[m.id]) || {};
    var html = "";
    // 目标卡
    html += '<div class="card"><div class="card-title">每日营养目标</div><div class="target-grid">';
    NUTRI_KEYS.forEach(function (n) {
      html += '<div class="target-cell"><div class="v">' + Math.round(std[n.k] || 0) + '</div><div class="l">' + n.name + "</div><div class='u'>" + n.unit + "</div></div>";
    });
    html += "</div></div>";
    // 建议
    if (advice && advice.length) {
      html += '<div class="card"><div class="card-title">饮食建议</div><ul class="advice-list">';
      advice.forEach(function (a) { html += "<li>" + esc(a) + "</li>"; });
      html += "</ul></div>";
    }
    // 本周达标追踪
    html += '<div class="card"><div class="card-title">本周营养累计（' + esc(m.name) + "）</div>";
    html += '<p class="note">按份量折算估算，与每日目标 ×7 对比。绿达标、黄偏低、橙偏高。</p>';
    var acc = weekNutriFor(m.id);
    NUTRI_KEYS.forEach(function (n) {
      if (n.k === "folate" && (std[n.k] || 0) === 0) return;
      var got = acc[n.k];
      var target = (std[n.k] || 0) * 7;
      var ratio = target > 0 ? got / target : 0;
      var pctW = Math.min(100, Math.round(ratio * 100));
      var cls = ratio >= 0.9 ? "ok" : (ratio > 1.1 ? "over" : "low");
      var statusTxt = ratio >= 0.9 ? "达标" : (ratio > 1.1 ? "偏高" : "偏低");
      html += '<div class="nutri-track"><div class="row"><span class="name">' + n.name + "</span>" +
        '<span class="val">' + Math.round(got) + " / " + Math.round(target) + " " + n.unit + " · " + statusTxt + "</span></div>" +
        '<div class="bar-bg"><div class="track-fg ' + cls + '" style="width:' + pctW + '%"></div></div></div>';
    });
    html += "</div>";
    if (disclaimer) html += '<p class="note" style="text-align:center">' + esc(disclaimer) + "</p>";
    body.innerHTML = html;
    var btn = document.getElementById("gen-plan");
    if (btn) {
      btn.disabled = !!offline;
      if (offline) btn.style.opacity = ".5";
    }
  }
  function generateForMember() {
    var m = currentMemberObj();
    if (!m) return;
    var btn = document.getElementById("gen-plan");
    if (btn) { btn.disabled = true; btn.textContent = "生成中…"; }
    api("POST", "/api/members/" + encodeURIComponent(m.id) + "/plan", { week: state.week })
      .then(function (d) {
        planCache[m.id] = d;
        state.week = d.week;
        return api("/api/week", { method: "PUT", body: JSON.stringify(d.week) });
      })
      .then(function () {
        toast("✅ 已为 " + m.name + " 生成周方案");
        paintPlanBody(m, planCache[m.id].advice || [], planCache[m.id].disclaimer, false, planCache[m.id]);
        if (currentPage === "week") renderWeek();
        if (currentPage === "today") renderToday();
      })
      .catch(function () { toast("生成失败，请确认服务已连接"); if (btn) { btn.disabled = false; btn.textContent = "✨ 生成我的周方案"; } });
  }

  /* ---------- 页面切换 ---------- */
  var PAGE_TITLES = { today: "今日", week: "本周", recipes: "食谱", shopping: "采购", pantry: "库存", plan: "方案" };
  function showPage(page) {
    currentPage = page;
    document.querySelectorAll(".page").forEach(function (p) { p.classList.add("hidden"); });
    document.getElementById("page-" + page).classList.remove("hidden");
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.getAttribute("data-page") === page);
    });
    document.getElementById("app-title").textContent = PAGE_TITLES[page];
    if (page === "today") renderToday();
    else if (page === "week") renderWeek();
    else if (page === "recipes") renderRecipes();
    else if (page === "shopping") renderShopping();
    else if (page === "pantry") renderPantry();
    else if (page === "plan") renderPlan();
  }

  /* ---------- 重置（仅清空勾选进度） ---------- */
  function resetProgress() {
    if (!confirm("确定清空采购勾选与餐次完成记录？（不影响食谱/周计划/库存/成员）")) return;
    state.shoppingChecked = {}; state.doneMeals = {};
    api("/api/kv/shoppingChecked", { method: "PUT", body: JSON.stringify({ value: {} }) }).catch(function () {});
    api("/api/kv/doneMeals", { method: "PUT", body: JSON.stringify({ value: {} }) }).catch(function () {});
    showPage(currentPage);
    toast("进度已清空");
  }

  /* ---------- 初始化 ---------- */
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () { showPage(tab.getAttribute("data-page")); });
  });
  document.getElementById("btn-reset").addEventListener("click", resetProgress);
  loadVersion();
  loadState(function () { renderMemberBar(); showPage("today"); });
})();

</script>
</body>
</html>
